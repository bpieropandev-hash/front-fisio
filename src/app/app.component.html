@if (authService.isAuthenticated() && !isMobileShell()) {
  <div class="top-shell">
    <p-menubar [model]="menuItems">
      <ng-template pTemplate="end">
        <div class="avatar-trigger" (click)="avatarMenu.toggle($event)">
          @if (usuarioAtual()?.fotoBase64) {
            <img [src]="usuarioAtual()?.fotoBase64" alt="Foto de perfil" class="avatar-foto" />
          } @else {
            <div class="avatar-placeholder">
              <i class="pi pi-user"></i>
            </div>
          }
        </div>
        <p-menu #avatarMenu [model]="avatarMenuItems" [popup]="true" [appendTo]="'body'" />
      </ng-template>
    </p-menubar>
  </div>
}

@if (isMobileShell()) {
  <header class="mobile-header">
    <div class="mobile-header__row">
      <div class="mobile-header__title">{{ currentRouteTitle() }}</div>
      <div class="mobile-header__avatar" (click)="avatarMenu.toggle($event)">
        @if (usuarioAtual()?.fotoBase64) {
          <img [src]="usuarioAtual()?.fotoBase64" alt="Foto de perfil" class="avatar-foto" />
        } @else {
          <div class="avatar-placeholder">{{ (usuarioAtual()?.nome || '?').charAt(0).toUpperCase() }}</div>
        }
      </div>
    </div>
    <p-menu #avatarMenu [model]="avatarMenuItems" [popup]="true" [appendTo]="'body'" />
  </header>
}

<main class="main-content" [class.main-content--mobile-shell]="isMobileShell()">
  <router-outlet />
</main>

@if (isMobileShell()) {
  <app-bottom-nav (abrirMais)="maisSheetAberto.set(true)" />
  <app-mais-sheet [aberto]="maisSheetAberto()" (fechar)="maisSheetAberto.set(false)" />
}
