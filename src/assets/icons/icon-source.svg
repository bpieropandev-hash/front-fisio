<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="shape">
      <rect x="0" y="0" width="512" height="512" rx="115" ry="115" />
    </clipPath>
    <filter id="innerShadowBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="28" />
    </filter>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="115" ry="115" fill="#4CC9F0" />

  <g clip-path="url(#shape)">
    <ellipse cx="256" cy="-40" rx="300" ry="140" fill="#06222C" opacity="0.10" filter="url(#innerShadowBlur)" />
  </g>

  <text
    x="256"
    y="330"
    text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif"
    font-weight="700"
    font-size="330"
    fill="#06222C"
  >P</text>
</svg>
